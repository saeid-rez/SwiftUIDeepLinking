name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      
      - name: Install SwiftLint using Homebrew
        run: brew install swiftlint

      - name: run SwiftLint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swiftlint . --reporter checkstyle | reviewdog -f=checkstyle -name="swiftlint" -reporter=github-pr-review

  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build
        run: |
          xcodebuild clean build \
          -project Deep_Linking_with_TCA/DeepLinkTCA.xcodeproj \
          -scheme DeepLinkTCA \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -skipPackagePluginValidation \
          -skipMacroValidation
